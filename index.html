<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#ebe8ee;--nav:#1f3a78;--nav2:#34549f;--ac:#17b5ea;--tx:#17233f;--card:#f6f6fa;--bd:#b9bfd0;--ok:#2ecc40;--bad:#ff3b30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;font:13px/1.35 system-ui,'Segoe UI',Roboto,sans-serif;color:var(--tx);background:var(--bg);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,.term,#evd,#tip{-webkit-user-select:text;user-select:text}
#top,#cats,#items{touch-action:pan-x}#wb,#db,#ps,.ab{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@media(pointer:coarse){input,select,textarea,.ti{font-size:16px!important}.b{min-height:40px}#cats button,.tabs2 button{min-height:42px}.tile i{width:84px;height:74px}}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--nav);overflow-x:auto;scrollbar-width:none;flex:none}
#top::-webkit-scrollbar{display:none}
.b{background:var(--nav2);color:#fff;border:0;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;flex:none;touch-action:manipulation;transition:background .2s}
.b.on{background:var(--ac);color:#06223a;font-weight:600}
.b:active{transform:scale(.96)}
.sep{width:1px;height:22px;background:#ffffff40;flex:none}
.logo{color:#fff;font-weight:700;letter-spacing:.04em;flex:none;margin-right:2px}
#main{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#17233fe0;color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:92%;text-align:center;z-index:5}
#hint.on{opacity:1}
#tip{position:absolute;z-index:6;background:#fffffa;border:1px solid #333;padding:6px 8px;font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre;pointer-events:none;display:none;max-width:96%;overflow:hidden}
#dock{position:absolute;right:8px;bottom:8px;width:min(500px,calc(100% - 16px));background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0003;z-index:4;display:flex;flex-direction:column;max-height:44%}
#dh{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--nav);color:#fff;border-radius:9px 9px 0 0;cursor:pointer}
#dh b{flex:1;font-size:12px}
#dh .b{padding:4px 10px}
#db{overflow:auto;display:none;flex:1;min-height:0}
#dock.open #db{display:block}
.chip{border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;min-height:28px}.chip.on{background:var(--c);color:#fff}
#flt{display:flex;gap:6px;flex-wrap:wrap;padding:6px;align-items:center;border-bottom:1px solid var(--bd)}
.msg{background:#eef4ff;border:1px solid #bcd0ff;border-radius:8px;padding:6px 8px;margin:4px 0}
.tabs2{display:flex;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff}
.tabs2 button{flex:1;padding:6px;border:0;background:none;cursor:pointer}
.tabs2 button.on{border-bottom:2px solid var(--ac);font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb th{background:#e3e6f0;text-align:left;padding:3px 5px;position:sticky;top:0}
.tb td{padding:3px 5px;border-bottom:1px solid #e6e8f0}
.tb tr[data-i]{cursor:pointer}.tb tr.sel{background:#d8ecff}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px}
#evd{font:11px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap;padding:6px 8px;background:#f4f6fb;border-top:1px solid var(--bd)}
#drawer{flex:none;background:#dde2ee;border-top:2px solid var(--nav);padding:4px 6px calc(4px)}
#cats,#items{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
#cats button{border:0;background:#c3cbe0;border-radius:8px;padding:6px 12px;cursor:pointer;flex:none}
#cats button.on{background:var(--nav);color:#fff}
.it{flex:none;width:96px;height:78px;border:1px solid var(--bd);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:10.5px;text-align:center;touch-action:manipulation}
.it.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset;background:#e8f7fd}
.it img{width:60px;height:47px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:#17233f;color:#fff;padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#ps{position:fixed;inset:auto 0 0 0;background:#fff;z-index:40;border-radius:14px 14px 0 0;box-shadow:0 -6px 30px #0004;padding:10px;display:none;max-height:55%;overflow:auto}
#ps.on{display:block}

#ps .g button{border:1px solid var(--bd);background:#f6f6fa;border-radius:8px;padding:8px;text-align:left;cursor:pointer}
#ps .g button[disabled]{opacity:.4}
#ov{position:fixed;left:0;right:0;top:0;height:100%;background:#0006;z-index:50;display:none;align-items:center;justify-content:center;padding:10px}
#ov.on{display:flex}
#win{width:min(760px,100%);height:min(680px,100%);background:var(--card);border:1px solid #666;border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 50px #0006}
#wh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--bd)}
#wh b{flex:1}
#wh button{border:0;background:none;font-size:18px;cursor:pointer;padding:0 6px}
#wt{display:flex;gap:2px;padding:6px 10px 0;background:#fff;overflow-x:auto;flex:none}
#wt button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent}
#wt button.on{border-color:var(--nav2);font-weight:600}
#wb{flex:1;min-height:0;overflow:auto;padding:12px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{width:120px;flex:none}
.row input[type=text],.row select,.row textarea{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff}
.row input.bad{border-color:var(--bad)}
.row input:disabled{background:#eceef4}
h4{margin:10px 0 4px;color:var(--nav)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;background:#1a3a7a;padding:14px;border-radius:6px}
.tile{background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.tile i{font-style:normal;font-size:34px;width:78px;height:70px;background:#3cc4ef;display:flex;align-items:center;justify-content:center;border:1px solid #fff4}
.app{display:flex;flex-direction:column;height:100%;min-height:340px}
.ah{background:#2a47d6;color:#fff;padding:4px 8px;display:flex;align-items:center}
.ah b{flex:1;font-weight:500}.ah button{background:#fff;color:#111;border:1px solid #999;width:28px;height:24px;cursor:pointer}
.ab{flex:1;min-height:0;overflow:auto;background:#fff;padding:8px;border:1px solid var(--bd)}
.term{background:#14181f;color:#e6e6e6;font:12px/1.4 ui-monospace,Consolas,monospace;padding:8px;overflow:auto;height:100%;min-height:300px;white-space:pre-wrap;word-break:break-all;cursor:text}
.tl{display:flex}.tl span{white-space:pre}
.ti{background:transparent;border:0;outline:0;color:inherit;font:inherit;flex:1;min-width:0}
.web{border:1px solid var(--bd);background:#fff;min-height:220px;padding:10px;margin-top:8px;overflow:auto}
.split{display:flex;gap:10px;height:100%}
.nav{flex:none;width:110px;border:1px solid var(--bd);background:#fff}
.nav button{display:block;width:100%;padding:9px;border:0;border-bottom:1px solid #e6e8f0;background:none;text-align:left;cursor:pointer}
.nav button.on{background:var(--ac);color:#fff}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.phys{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.phys img{width:120px;height:96px;background:#fff;border:1px solid var(--bd);border-radius:10px}
.sm{font-size:11px;color:#556}
@media(max-width:640px){#ov{padding:0}#win{height:100%;border-radius:0}.row label{width:84px}.split{flex-direction:column}.nav{width:auto;display:flex}.nav button{border-bottom:0}.logo{display:none}}
</style>

 <span class="logo">NET·SIM</span>

/* ───────── Core model ───────── */

}

}

const ll6 = mac => V6.str(V6.eui(mac)).toUpperCase();

/* IPv6 addresses of a port (hosts: link-local always on; routers: after "ipv6 enable"/"ipv6 address"); state flags tent/dup come from runtime fields */

const v6use = q => !q.tent && !q.dup;

const NULL6 = { name: 'Null0', lo: true, ok: true, x: {} };
const as6 = z => z.any ? 'any' : z.p.endsWith('/128') ? 'host ' + z.p.slice(0, -4).toUpperCase() : z.p.toUpperCase();
